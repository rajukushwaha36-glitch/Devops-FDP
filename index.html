<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone City Simulation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:linear-gradient(to bottom,#4da6ff,#cce6ff);
    height:100vh;
    font-family:Arial,sans-serif;
}

/* Sun */
.sun{
    position:absolute;
    top:50px;
    right:100px;
    width:100px;
    height:100px;
    background:gold;
    border-radius:50%;
    box-shadow:0 0 50px gold;
}

/* City */
.city{
    position:absolute;
    bottom:0;
    width:100%;
    height:45%;
    display:flex;
    align-items:flex-end;
}

.building{
    background:#2c3e50;
    margin:0 5px;
    width:80px;
    position:relative;
}

.window{
    position:absolute;
    width:10px;
    height:10px;
    background:yellow;
}

/* Drone */
.drone{
    position:absolute;
    width:60px;
    height:25px;
}

.body{
    position:absolute;
    width:40px;
    height:12px;
    background:#333;
    border-radius:8px;
    left:10px;
    top:7px;
}

.propeller{
    position:absolute;
    width:15px;
    height:15px;
    border:3px solid #000;
    border-radius:50%;
    animation:spin 0.15s linear infinite;
}

.p1{left:0; top:0;}
.p2{right:0; top:0;}
.p3{left:0; bottom:0;}
.p4{right:0; bottom:0;}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.info{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(255,255,255,0.8);
    padding:10px 20px;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="sun"></div>

<div class="info">
    🚁 Smart Drone Traffic Simulation
</div>

<!-- City -->
<div class="city" id="city"></div>

<!-- Drones -->
<div class="drone" id="drone1">
    <div class="body"></div>
    <div class="propeller p1"></div>
    <div class="propeller p2"></div>
    <div class="propeller p3"></div>
    <div class="propeller p4"></div>
</div>

<div class="drone" id="drone2">
    <div class="body"></div>
    <div class="propeller p1"></div>
    <div class="propeller p2"></div>
    <div class="propeller p3"></div>
    <div class="propeller p4"></div>
</div>

<div class="drone" id="drone3">
    <div class="body"></div>
    <div class="propeller p1"></div>
    <div class="propeller p2"></div>
    <div class="propeller p3"></div>
    <div class="propeller p4"></div>
</div>

<script>
// Generate city buildings
const city = document.getElementById("city");

for(let i=0;i<18;i++){
    let building = document.createElement("div");
    building.className = "building";

    let height = 100 + Math.random()*250;
    building.style.height = height + "px";

    for(let j=0;j<20;j++){
        let win = document.createElement("div");
        win.className = "window";
        win.style.left = (10 + (j%4)*15) + "px";
        win.style.top = (15 + Math.floor(j/4)*25) + "px";
        building.appendChild(win);
    }

    city.appendChild(building);
}

// Drone movement
const drones = [
    {
        el: document.getElementById("drone1"),
        x: 50,
        y: 150,
        dx: 2,
        dy: 0.5
    },
    {
        el: document.getElementById("drone2"),
        x: 400,
        y: 250,
        dx: -1.8,
        dy: 0.4
    },
    {
        el: document.getElementById("drone3"),
        x: 700,
        y: 120,
        dx: 2.5,
        dy: -0.3
    }
];

function animate(){
    drones.forEach(drone => {

        drone.x += drone.dx;
        drone.y += drone.dy;

        if(drone.x < 0 || drone.x > window.innerWidth - 60){
            drone.dx *= -1;
        }

        if(drone.y < 50 || drone.y > window.innerHeight * 0.5){
            drone.dy *= -1;
        }

        drone.el.style.left = drone.x + "px";
        drone.el.style.top = drone.y + "px";
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
